<div class="model-select">
  @if (loading()) {
    <span class="model-select__status" role="status">{{ 'common.loading' | translate }}</span>
  } @else if (useManualInput()) {
    <input
      class="model-select__manual"
      type="text"
      [value]="value()"
      [disabled]="isDisabled()"
      [attr.aria-label]="'modelSelect.label' | translate"
      [placeholder]="'modelSelect.placeholder' | translate"
      (input)="onManualInput($event)"
      (blur)="markTouched()"
    >
  } @else {
    <app-select
      [options]="options()"
      [value]="value()"
      [disabled]="isDisabled()"
      [searchable]="true"
      [placeholder]="'modelSelect.choose' | translate"
      [searchPlaceholder]="'modelSelect.search' | translate"
      [ariaLabel]="'modelSelect.label' | translate"
      (valueChange)="onValueChange($event)"
    />
  }
</div>
