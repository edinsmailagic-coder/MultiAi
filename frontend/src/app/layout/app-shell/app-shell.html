<div class="shell">
  <aside [class.open]="mobileOpen()">
    <a class="shell-brand" routerLink="/dashboard">Multi<span>AI</span></a>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">
        <span aria-hidden="true">⌂</span>{{ 'nav.dashboard' | translate }}
      </a>
      <a routerLink="/workflows" routerLinkActive="active" (click)="closeMenu()">
        <span aria-hidden="true">◈</span>{{ 'nav.workflows' | translate }}
      </a>
      <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">
        <span aria-hidden="true">◎</span>{{ 'nav.profile' | translate }}
      </a>
    </nav>
    <div class="sidebar-user">
      <div class="avatar">{{ initials() }}</div>
      <div>
        <strong>{{ auth.currentUser()?.firstName }} {{ auth.currentUser()?.lastName }}</strong>
        <small>{{ auth.currentUser()?.email }}</small>
      </div>
    </div>
    <button class="logout" type="button" (click)="logout()">{{ 'nav.logout' | translate }}</button>
  </aside>

  @if (mobileOpen()) {
    <button class="backdrop" type="button" aria-label="Close menu" (click)="closeMenu()"></button>
  }

  <div class="shell-main">
    <header>
      <button class="hamburger" type="button" (click)="toggleMenu()" aria-label="Menu">☰</button>
      <span class="spacer"></span>
      <button class="language-button" type="button" (click)="changeLanguage()">BS / EN</button>
    </header>
    <main>
      <router-outlet />
    </main>
  </div>
</div>
