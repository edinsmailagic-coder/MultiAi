<main class="auth-page">
  <section class="auth-card">
    <div class="language">
      <button type="button" [class.active]="currentLanguage() === 'bs'" (click)="changeLanguage('bs')">BS</button>
      <button type="button" [class.active]="currentLanguage() === 'en'" (click)="changeLanguage('en')">EN</button>
    </div>

    <app-brand link="/" size="lg" />
    <h1>{{ 'auth.loginTitle' | translate }}</h1>
    <p class="subtitle">{{ 'auth.loginSubtitle' | translate }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        {{ 'auth.email' | translate }}
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [placeholder]="'auth.emailPlaceholder' | translate"
        >
      </label>
      <app-field-error [control]="form.controls.email" fieldKey="auth.email" />

      <label>
        {{ 'auth.password' | translate }}
        <input type="password" formControlName="password" autocomplete="current-password">
      </label>
      <app-field-error [control]="form.controls.password" fieldKey="auth.password" />

      <button class="primary full" type="submit" [disabled]="loading()">
        {{ (loading() ? 'common.loading' : 'auth.login') | translate }}
      </button>
    </form>

    <p class="auth-link">
      {{ 'auth.noAccount' | translate }}
      <a routerLink="/register">{{ 'auth.register' | translate }}</a>
    </p>
  </section>
</main>
