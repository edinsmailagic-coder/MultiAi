<section class="page-heading">
  <div>
    <p class="eyebrow">{{ 'nav.accountProfile' | translate }}</p>
    <h1>{{ 'profile.pageTitle' | translate }}</h1>
    <p>{{ 'profile.pageSubtitle' | translate }}</p>
  </div>
</section>

<section class="panel account-card">
  <h2>{{ 'profile.personal' | translate }}</h2>
  <p class="muted">{{ auth.currentUser()?.email }}</p>
  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
    <div class="form-row">
      <label>{{ 'auth.firstName' | translate }}
        <input formControlName="firstName">
      </label>
      <label>{{ 'auth.lastName' | translate }}
        <input formControlName="lastName">
      </label>
    </div>
    <button class="primary" type="submit">{{ 'common.save' | translate }}</button>
  </form>
</section>
