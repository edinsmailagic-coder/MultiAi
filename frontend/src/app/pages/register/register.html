<main class="auth-page">
  <section class="auth-card register-card">
    <div class="language">
      <button type="button" [class.active]="currentLanguage() === 'bs'" (click)="changeLanguage('bs')">BS</button>
      <button type="button" [class.active]="currentLanguage() === 'en'" (click)="changeLanguage('en')">EN</button>
    </div>

    <app-brand link="/" size="lg" />
    <h1>{{ 'auth.registerTitle' | translate }}</h1>
    <p class="subtitle">{{ 'auth.registerSubtitle' | translate }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-row">
        <div>
          <label>{{ 'auth.firstName' | translate }}
            <input formControlName="firstName" autocomplete="given-name">
          </label>
          <app-field-error [control]="form.controls.firstName" fieldKey="auth.firstName" />
        </div>
        <div>
          <label>{{ 'auth.lastName' | translate }}
            <input formControlName="lastName" autocomplete="family-name">
          </label>
          <app-field-error [control]="form.controls.lastName" fieldKey="auth.lastName" />
        </div>
      </div>

      <label>{{ 'auth.email' | translate }}
        <input type="email" formControlName="email" autocomplete="email">
      </label>
      <app-field-error [control]="form.controls.email" fieldKey="auth.email" />

      <div class="form-row">
        <div>
          <label>{{ 'auth.password' | translate }}
            <input type="password" formControlName="password" autocomplete="new-password">
          </label>
          <app-field-error [control]="form.controls.password" fieldKey="auth.password" />
        </div>
        <div>
          <label>{{ 'auth.confirmPassword' | translate }}
            <input type="password" formControlName="confirmPassword" autocomplete="new-password">
          </label>
          <app-field-error [control]="form.controls.confirmPassword" fieldKey="auth.confirmPassword" />
        </div>
      </div>

      @if (form.touched && form.hasError('passwordMismatch')) {
        <small class="field-error">{{ 'auth.passwordMismatch' | translate }}</small>
      }

      <button class="primary full" type="submit" [disabled]="loading()">
        {{ (loading() ? 'common.loading' : 'auth.createAccount') | translate }}
      </button>
    </form>

    <p class="auth-link">
      {{ 'auth.hasAccount' | translate }}
      <a routerLink="/login">{{ 'auth.login' | translate }}</a>
    </p>
  </section>
</main>
